plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hunik.kboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hunik.kboard'
        minSdk 19
        targetSdk 34
        versionCode 10000      // 1.0.0 -> major*10000 + minor*100 + patch
        versionName '1.0.0'
    }

    // Fixed key: new builds install over the old one without uninstalling.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
